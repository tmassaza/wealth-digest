[project]
name = "wealth-digest"
version = "0.1.0"
description = "Wealth Digest POC: fake user/news matching via embeddings and pgvector"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.1",
  "psycopg[binary]>=3.1.19",
  "pgvector>=0.2.5",
  "python-dotenv>=1.0.1",
  "sentence-transformers>=3.2.1",
  "pydantic>=2.7.1",
  "pydantic-settings>=2.2.1",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"
