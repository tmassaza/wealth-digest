@if (user) {
<div class="w-full rounded-xl border border-[#e8ebf5] bg-white
           px-5 py-5 sm:px-7 sm:py-6
           shadow-[0_2px_8px_rgba(30,41,80,0.06)]">

    <div class="flex flex-col gap-6
             md:flex-row md:items-center md:justify-between">

        <div class="min-w-0">

            <div class="flex items-center gap-2">

                <span class="h-2.5 w-2.5 shrink-0 rounded-full bg-[#4f46dc]"></span>

                <h2 class="font-serif text-[19px] font-bold leading-tight
                   text-[#17243a] sm:text-[20px]">
                    {{user.name}}
                </h2>

            </div>

            <p class="mt-2.5 text-sm leading-5 text-[#5f6b85]
                 sm:text-[15px]">
                {{user.profile_text}}
            </p>

            <p class="mt-3 text-[11px] leading-4 tracking-wide
                 text-[#667189] sm:text-[12px]">
                <span class="font-bold text-[#25334a]">
                    Frequenza Notifiche:
                </span>

                @if (user.notification_interval_days == 1) {
                    <span class="ml-1">
                        Una notifica ogni giorno
                    </span>
                }@else {
                    <span class="ml-1">
                        Una notifica ogni {{user.notification_interval_days}} giorni
                    </span>
                }
            </p>

        </div>

        <div class="flex w-full flex-col gap-2
               sm:flex-row md:w-auto md:shrink-0">

            <button type="button" class="cursor-pointer flex w-full items-center justify-center gap-2  rounded-lg bg-[#392bd5]
                 px-4 py-3
                 text-sm font-semibold text-white
                 shadow-sm
                 transition-colors duration-200
                 hover:bg-[#3023bd]
                 focus:outline-none
                 focus:ring-2 focus:ring-[#392bd5]/30
                 sm:w-auto sm:text-[15px]"
                 (click)="generateNewNotification()"
                 [disabled]="isLoading"
                 >
                <svg 
                    [class.spinning]="isLoading"
                    xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                    <path d="M21 3v6h-6" />
                </svg>
                Rimani aggiornato
            </button>

            <button type="button" class="w-full rounded-lg
                 border border-[#dfe5f5]
                 bg-[#f1f4ff]
                 px-4 py-3
                 text-sm font-semibold text-[#302bd5]
                 transition-colors duration-200
                 hover:bg-[#e8edff]
                 focus:outline-none
                 focus:ring-2 focus:ring-[#392bd5]/20
                 sm:w-auto sm:text-[15px]">
                Tutte le notifiche ({{notificationsCount}})
            </button>

        </div>

    </div>

</div>
}
