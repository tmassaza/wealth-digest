<article class="w-full overflow-hidden rounded-xl border border-gray-200
           border-l-4 border-l-indigo-600 bg-white shadow-sm">

    <div class="px-6 pt-6 pb-4">

        <h2 class="font-serif text-xl font-bold leading-tight text-slate-800">
            {{news.title}}
        </h2>

        <p class="mt-3 text-base leading-6 text-slate-500">
            {{news.summary}}
        </p>

        <div class="mt-4 flex gap-3 rounded-lg border border-indigo-100
               bg-indigo-50 px-4 py-4">

            <div class="flex shrink-0 pt-0.5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-600" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M12 3a7 7 0 0 0-4.5 12.35c.32.27.5.67.5 1.09V18h8v-1.56c0-.42.18-.82.5-1.09A7 7 0 0 0 12 3Z" />
                    <path d="M9 21h6" />
                    <path d="M9 18h6" />
                    <circle cx="12" cy="9" r="1" />
                    <path d="M12 10v3" />
                </svg>
            </div>

            <div>
                <div class="text-[10px] font-bold uppercase tracking-wide
                   text-indigo-600">
                    PERCHÉ TI PUò INTERESSARE:
                </div>

                <p class="mt-1 text-sm leading-5 text-slate-700">
                    {{news.relevance}}
                </p>
            </div>
        </div>
    </div>

    <div class="mx-6 border-t border-gray-100"></div>

    <footer class="flex items-center justify-between gap-4 px-6 py-3">
        <span class="text-[11px] font-semibold tracking-wide text-slate-500">
            Fonte: {{news.source}}
        </span>

        <a href="{{news.link}}" target="_blank" class="group flex shrink-0 items-center gap-1 text-xs
               font-bold text-indigo-600 transition-colors
               hover:text-indigo-800">
            Leggi notizia completa

            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transition-transform group-hover:translate-x-0.5"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M5 12h14" />
                <path d="m13 6 6 6-6 6" />
            </svg>
        </a>
    </footer>

</article>
